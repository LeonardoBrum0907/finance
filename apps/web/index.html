<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finanças</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("finance-app-theme");
          document.documentElement.dataset.theme = theme === "comfy" ? "comfy" : "default";
        } catch (e) {
          document.documentElement.dataset.theme = "default";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
